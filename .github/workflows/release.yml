name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name BOBOLogcatCapture `
            --icon "$PWD\assets\sage.ico" `
            --add-data "$PWD\assets\sage.ico;assets" `
            --distpath "build\BOBOLogcatCapture" `
            --workpath "build\pyinstaller-work" `
            --specpath "build" `
            --collect-all customtkinter `
            logcat_capture_gui.py

      - name: Package release asset
        run: |
          Compress-Archive `
            -Force `
            -Path "build\BOBOLogcatCapture\BOBOLogcatCapture.exe" `
            -DestinationPath "build\BOBOLogcatCapture-${{ github.ref_name }}-windows.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "BOBOLogcatCapture ${{ github.ref_name }}"
          files: "build/BOBOLogcatCapture-${{ github.ref_name }}-windows.zip"
          body: |
            ## BOBOLogcatCapture ${{ github.ref_name }}

            Windows release build.

            ### Features
            - Detect ADB automatically
            - List connected Android devices
            - Capture and preview logcat logs
            - Save complete logs locally
            - Optional fresh-log capture by clearing old logcat buffer
