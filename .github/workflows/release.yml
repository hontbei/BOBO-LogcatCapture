name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Tk dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tcl-dev tk-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name BOBOLogcatCapture `
            --icon "$PWD\assets\sage.ico" `
            --add-data "$PWD\assets\sage.ico;assets" `
            --distpath "build\BOBOLogcatCapture-windows" `
            --workpath "build\pyinstaller-work-windows" `
            --specpath "build" `
            --collect-all customtkinter `
            logcat_capture_gui.py

      - name: Build Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name BOBOLogcatCapture \
            --add-data "$PWD/assets/sage.ico:assets" \
            --distpath "build/BOBOLogcatCapture-${{ matrix.platform }}" \
            --workpath "build/pyinstaller-work-${{ matrix.platform }}" \
            --specpath "build" \
            --collect-all customtkinter \
            logcat_capture_gui.py

      - name: Package release asset
        shell: pwsh
        run: |
          Compress-Archive `
            -Force `
            -Path "build/BOBOLogcatCapture-${{ matrix.platform }}/*" `
            -DestinationPath "build/BOBOLogcatCapture-${{ github.ref_name }}-${{ matrix.platform }}.zip"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: BOBOLogcatCapture-${{ github.ref_name }}-${{ matrix.platform }}
          path: build/BOBOLogcatCapture-${{ github.ref_name }}-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "BOBOLogcatCapture ${{ github.ref_name }}"
          files: "release-assets/*.zip"
          body: |
            ## BOBOLogcatCapture ${{ github.ref_name }}

            Cross-platform release builds.

            ### Downloads
            - Windows: `BOBOLogcatCapture-${{ github.ref_name }}-windows.zip`
            - Linux: `BOBOLogcatCapture-${{ github.ref_name }}-linux.zip`
            - macOS: `BOBOLogcatCapture-${{ github.ref_name }}-macos.zip`

            ### Notes
            - Android Platform Tools / ADB must be installed or available in PATH.
            - macOS builds are not Apple-notarized, so macOS may show a security warning on first launch.
            - Linux builds may require a desktop environment with Tk support.
